# Profile activated when running inside podman-compose.
# The bff container resolves keycloak.localhost via extra_hosts -> host-gateway,
# and browsers resolve it natively (*.localhost -> 127.0.0.1), so a single
# issuer-uri works for both server-side and browser-facing flows.
spring:
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: http://keycloak.localhost:9090/realms/app-realm
            user-name-attribute: preferred_username

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.cloud.gateway: DEBUG

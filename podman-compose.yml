services:

  # health checks - see https://gist.github.com/sarath-soman/5d9aec06953bbd0990c648605d4dba07
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "admin"
      KC_HTTP_PORT: "9090"
      KC_HOSTNAME: "keycloak.localhost"
      KC_HOSTNAME_PORT: "9090"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "9090:9090"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:Z
    healthcheck:
      test:
        - "CMD-SHELL"
        - |
          exec 3<>/dev/tcp/127.0.0.1/9000;
          echo -e "GET /health/ready HTTP/1.1\r\nHost: localhost:9000\r\nConnection: close\r\n\r\n" >&3;
          if cat <&3 | grep -q "\"status\": \"UP\""; then
            exit 0
          else
            exit 1
          fi
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  redis:
    image: docker.io/redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  bff:
    build:
      context: ./bff
      dockerfile: Containerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: compose
      SPRING_DATA_REDIS_HOST: redis
      FRONTEND_URL: http://frontend:4200
    extra_hosts:
      - "keycloak.localhost:host-gateway"
    depends_on:
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile.dev
    ports:
      - "4200:4200"
    volumes:
      - ./frontend/src:/app/src:Z

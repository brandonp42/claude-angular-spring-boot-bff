services:

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 9090
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 9090
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: true
    ports:
      - "9090:9090"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:Z
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9090 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\n\r\n' >&3 && cat <&3 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  redis:
    image: docker.io/redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  bff:
    build:
      context: ./bff
      dockerfile: Containerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: compose
      KEYCLOAK_BASE_URL: http://keycloak:9090
      KEYCLOAK_BROWSER_URL: http://localhost:9090
      SPRING_DATA_REDIS_HOST: redis
      FRONTEND_URL: http://frontend:4200
    depends_on:
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile.dev
    ports:
      - "4200:4200"
    volumes:
      - ./frontend/src:/app/src:Z
